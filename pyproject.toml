[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d28-electric-bus-depot-optimization"
version = "0.1.0"
description = "Multiobjective optimization of electric bus depot microgrids"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "PyYAML",
    "scipy",
    "pyomo",
    "highspy",
    "pymoo",
    "matplotlib"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

